services:
  - type: web
    name: patent-prior-art-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: PORT
        value: "8000"
      - key: PRIMARY_DB
        value: "mongodb"
      - key: DATABASE_URL
        value: "sqlite:///patentlens.db"
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: "patentlens"
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama3-70b-8192"
      - key: LLM_PROVIDER
        value: "groq"
      - key: MODEL_NAME
        value: "all-MiniLM-L6-v2"
      - key: LENS_API_TOKEN
        sync: false
      - key: LENS_API_URL
        value: "https://api.lens.org/patent/search"
      - key: MAX_EXTERNAL_API_RESULTS
        value: "100"
